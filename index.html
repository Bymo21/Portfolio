<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - الموقع قيد التعديل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #ffffff;
            color: #1f2937;
        }
        .fade-in {
            animation: fadeIn 1.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .gear-animation {
            animation: spin 6s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        /* إضافة تأثير ظل خفيف للرقم لجعل ظهوره مميزاً */
        .number-glow {
            text-shadow: 0 0 20px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen m-0 bg-white">

    <div class="text-center px-6 fade-in">
        <!-- أيقونة التعديل -->
        <div class="flex justify-center mb-6">
            <div class="relative">
                <svg class="w-24 h-24 text-blue-500/20 gear-animation" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </div>
        </div>

        <!-- رقم الخطأ 404 بشكل بارز وعصري -->
        <div class="relative inline-block mb-2">
            <h1 class="text-[120px] md:text-[160px] font-black text-gray-100 leading-none select-none number-glow">
                404
            </h1>
            <div class="absolute inset-0 flex items-center justify-center mt-8">
                <span class="bg-white px-4 text-sm font-bold tracking-widest text-blue-600 border border-blue-100 rounded-full shadow-sm">
                    ERROR
                </span>
            </div>
        </div>
        
        <!-- الرسالة الرئيسية -->
        <h2 class="text-3xl md:text-4xl font-extrabold text-gray-800 mb-4">الموقع قيد التعديل</h2>
        
        <!-- وصف إضافي -->
        <p class="text-gray-500 text-lg md:text-xl max-w-lg mx-auto leading-relaxed">
            نعتذر عن الإزعاج، نحن نقوم ببعض التحديثات التقنية الآن. سنعود للعمل قريباً جداً.
        </p>

        <!-- فاصل جمالي -->
        <div class="mt-12 flex justify-center space-x-2 space-x-reverse">
            <div class="h-1.5 w-1.5 bg-blue-500 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
            <div class="h-1.5 w-1.5 bg-blue-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
            <div class="h-1.5 w-1.5 bg-blue-300 rounded-full animate-bounce" style="animation-delay: 0.3s"></div>
        </div>
        
        <p class="mt-8 text-xs font-medium text-gray-400 uppercase tracking-widest">
            Coming Soon | قريباً
        </p>
    </div>

</body>
</html>
